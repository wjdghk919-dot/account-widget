<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고정 계좌 안내 방송 위젯</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* =========================================================
   방송용 고정 DISPLAY
========================================================= */

.account-widget {
    position: absolute;
    left: 30px;
    top: 30px;

    width: 360px;
    height: auto;
    padding: 12px 16px 13px;

    box-sizing: border-box;

    color: #fff;

    background:
        linear-gradient(
            180deg,
            #24262b 0%,
            #0f1013 100%
        );

    border: 2px solid #d8b84c;
    border-radius: 12px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.14);
}

/* 위쪽 한 줄 */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    min-height: 28px;
}

.bank-area {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
}

.bank-icon {
    width: 22px;
    height: 22px;

    flex: 0 0 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #d8b84c;
    color: #171717;

    font-size: 12px;
    font-weight: 900;
}

.bank-name {
    font-size: 15px;
    font-weight: 900;
    white-space: nowrap;
}

.initial {
    margin-left: 2px;

    color: #d7d7d7;

    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    white-space: nowrap;
}

.badge {
    padding: 4px 7px;

    border-radius: 5px;

    background: rgba(255,255,255,.08);

    color: #ddd;

    font-size: 11px;
    font-weight: 800;

    white-space: nowrap;
}

/* 구분선 */
.divider {
    height: 1px;

    margin: 9px 0 10px;

    background: rgba(255,255,255,.15);
}

/* 계좌번호 */
.account-number {
    color: #fff6c7;

    font-size: 30px;
    line-height: 1.15;
    font-weight: 900;

    letter-spacing: .5px;

    white-space: nowrap;

    text-shadow:
        0 2px 5px rgba(0,0,0,.45);
}


/* =========================================================
   운영용 CONTROL
========================================================= */

.control {
    position: absolute;

    left: 30px;
    top: 245px;

    width: 430px;

    padding: 18px;

    box-sizing: border-box;

    color: #fff;

    background: #18191d;

    border: 1px solid #555;
    border-radius: 12px;

    box-shadow:
        0 12px 28px rgba(0,0,0,.35);
}

.control.hidden {
    display: none;
}

.control h2 {
    margin: 0 0 16px;

    font-size: 21px;
}

.field {
    margin-bottom: 11px;
}

.field label {
    display: block;

    margin-bottom: 5px;

    color: #aaa;

    font-size: 12px;
}

.field input {
    width: 100%;
    height: 34px;

    box-sizing: border-box;

    padding: 0 10px;

    border: 1px solid #777;
    border-radius: 5px;

    font-size: 15px;
}

.row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.buttons {
    display: flex;

    gap: 8px;

    margin-top: 14px;
}

button {
    height: 36px;

    padding: 0 15px;

    border: 0;
    border-radius: 6px;

    font-size: 14px;
    font-weight: 900;

    cursor: pointer;
}

.apply-button {
    background: #d8b84c;
    color: #111;
}

.reset-button {
    background: #777;
    color: #fff;
}

.toggle-button {
    position: absolute;

    left: 30px;
    top: 190px;

    height: 30px;

    padding: 0 12px;

    background: #d8b84c;
    color: #111;

    font-size: 12px;
}

.note {
    margin-top: 10px;

    color: #888;

    font-size: 11px;
    line-height: 1.4;
}
</style>
</head>

<body>

<!-- =========================================================
     방송 화면용 고정 계좌 안내
========================================================= -->

<div class="account-widget">

    <div class="header">

        <div class="bank-area">

            <div class="bank-icon">₩</div>

            <div id="bankText" class="bank-name">
                카카오뱅크
            </div>

            <div id="initialText" class="initial">
                JH
            </div>

        </div>

        <div class="badge">
            계좌안내
        </div>

    </div>

    <div class="divider"></div>

    <div id="accountText" class="account-number">
        3333-04-9692388
    </div>

</div>


<!-- =========================================================
     CONTROL
========================================================= -->

<button
    id="toggleButton"
    class="toggle-button"
    onclick="toggleControl()"
>
    HIDE CONTROL
</button>

<div id="controlPanel" class="control">

    <h2>고정 계좌 안내 CONTROL</h2>

    <div class="field">

        <label>은행</label>

        <input
            id="bankInput"
            type="text"
            value="카카오뱅크"
        >

    </div>


    <div class="row">

        <div class="field">

            <label>이름 이니셜</label>

            <input
                id="initialInput"
                type="text"
                value="JH"
            >

        </div>


        <div class="field">

            <label>계좌번호</label>

            <input
                id="accountInput"
                type="text"
                value="3333-04-9692388"
            >

        </div>

    </div>


    <div class="buttons">

        <button
            class="apply-button"
            onclick="applyAccount()"
        >
            APPLY
        </button>

        <button
            class="reset-button"
            onclick="resetAccount()"
        >
            RESET
        </button>

    </div>


    <div class="note">
        방송용 DISPLAY는 계속 고정되어 있으며,
        은행명·이니셜·계좌번호만 바꿀 수 있습니다.
    </div>

</div>


<script>

function applyAccount() {

    document.getElementById("bankText").textContent =
        document.getElementById("bankInput").value;

    document.getElementById("initialText").textContent =
        document.getElementById("initialInput").value;

    document.getElementById("accountText").textContent =
        document.getElementById("accountInput").value;
}


function resetAccount() {

    document.getElementById("bankInput").value =
        "카카오뱅크";

    document.getElementById("initialInput").value =
        "JH";

    document.getElementById("accountInput").value =
        "3333-04-9692388";

    applyAccount();
}


function toggleControl() {

    const panel =
        document.getElementById("controlPanel");

    const button =
        document.getElementById("toggleButton");

    if (panel.classList.contains("hidden")) {

        panel.classList.remove("hidden");

        button.textContent =
            "HIDE CONTROL";

    } else {

        panel.classList.add("hidden");

        button.textContent =
            "SHOW CONTROL";
    }
}

</script>

</body>
</html>
