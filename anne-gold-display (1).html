<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ANNE GOLD - HUD DISPLAY</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;
  color:#111;
}

.hud{
  position:absolute;
  left:55px;
  top:85px;
  width:615px;
  padding:22px 26px 25px;
  background:
    linear-gradient(180deg,rgba(248,245,238,.76),rgba(238,232,218,.62));
  border:1px solid rgba(17,17,17,.9);
  border-radius:5px;
  box-shadow:
    0 10px 28px rgba(0,0,0,.16),
    inset 0 0 0 1px rgba(198,163,82,.82),
    inset 0 0 0 3px rgba(255,255,255,.28),
    inset 0 0 28px rgba(255,255,255,.10);
  overflow:hidden;
}

/* 고급스러운 이중 프레임 */
.hud::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(169,132,43,.58);
  pointer-events:none;
}

.hud::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,rgba(17,17,17,.95) 0%,rgba(17,17,17,.72) 23%,#c8a55a 50%,rgba(17,17,17,.72) 77%,rgba(17,17,17,.95) 100%);
  opacity:.9;
}

/* 미세 장식 */
.hud-top{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  height:62px;
  padding:4px 7px 0;
}

.hud-account{
  display:inline-flex;
  align-items:center;
  min-width:100px;
  color:#9d7922;
  font-family:"Noto Serif KR","Batang","Malgun Gothic",serif;
  font-size:37px;
  font-weight:900;
  letter-spacing:-1.8px;
  white-space:nowrap;
}

.hud-account::before{
  content:"";
  width:4px;
  height:29px;
  margin-right:11px;
  background:#111;
}

.hud-current{
  min-width:0;
  color:#090909;
  font-size:38px;
  font-weight:950;
  letter-spacing:-1.6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:right;
}

.hud-current.changing{
  animation:rollChange .38s ease;
}

@keyframes rollChange{
  0%{opacity:0;transform:translateY(12px);filter:blur(2px)}
  55%{opacity:1;transform:translateY(-2px);filter:blur(0)}
  100%{opacity:1;transform:translateY(0);filter:blur(0)}
}

.hud-divider{
  position:relative;
  height:2px;
  margin:14px 7px 18px;
  background:linear-gradient(90deg,rgba(17,17,17,.78) 0%,rgba(17,17,17,.55) 44%,#b58a2c 50%,rgba(17,17,17,.55) 56%,rgba(17,17,17,.78) 100%);
}

.hud-divider::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:5px;
  height:1px;
  background:rgba(184,146,52,.38);
}

/* 섹션 */
.notice-title,
.rank-title{
  position:relative;
  margin-left:7px;
  padding-left:15px;
  color:#111;
  font-family:"Noto Serif KR","Batang","Malgun Gothic",serif;
  font-size:37px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.notice-title{
  margin-bottom:12px;
}

.notice-title::before,
.rank-title::before{
  content:"";
  position:absolute;
  left:0;
  top:8px;
  bottom:7px;
  width:4px;
  background:#b58a2c;
}

.notice-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:0 7px;
}

.notice-line{
  position:relative;
  color:#181818;
  font-size:32px;
  line-height:1.16;
  font-weight:900;
  letter-spacing:-1.2px;
  padding-left:22px;
}

.notice-line::before{
  content:"◆";
  position:absolute;
  left:0;
  top:1px;
  color:#b58a2c;
  font-size:13px;
}

/* 참가자 */
.rank-title{
  margin-top:23px;
  margin-bottom:12px;
  color:#9d7922;
}

.rank-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:0 7px 1px;
}

.rank-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:39px;
  padding:4px 0 5px;
  border-bottom:1px solid rgba(23,23,23,.16);
  font-size:33px;
  line-height:1.12;
  font-weight:950;
  letter-spacing:-1.2px;
}

.rank-row:last-child{
  border-bottom:none;
}

.rank-name{
  min-width:0;
  color:#111;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rank-value{
  flex:0 0 auto;
  margin-left:22px;
  padding:2px 9px 3px;
  border:1px solid #111;
  background:rgba(17,17,17,.90);
  color:#d8b45e;
  box-shadow:0 2px 6px rgba(0,0,0,.14);
  font-size:27px;
  font-weight:950;
  letter-spacing:-.6px;
}

/* 여백이 과해 보이지 않도록 내용 밀도 유지 */
@media (max-width:700px){
  .hud{
    left:20px;
    width:calc(100vw - 40px);
  }
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body>

<div class="hud">
  <div class="hud-top">
    <div class="hud-account" id="accountLabel">계좌</div>
    <div id="currentText" class="hud-current">죽밥 ♥ 100,000</div>
  </div>

  <div class="hud-divider"></div>

  <div id="noticeTitle" class="notice-title">현재미션</div>
  <div id="noticeList" class="notice-list"></div>

  <div id="rankTitle" class="rank-title">참가자</div>
  <div id="rankList" class="rank-list"></div>
</div>

<script>
let activeDonations=[];
let currentDonationIndex=0;
let rollingTimer=null;

function formatAmount(value){
  const raw=String(value).replace(/,/g,"").trim();
  const n=Number(raw);
  return Number.isNaN(n)?String(value):n.toLocaleString("ko-KR")+"원";
}

function renderNotices(notices,title){
  document.getElementById("noticeTitle").textContent=title||"현재미션";
  const list=document.getElementById("noticeList");
  list.innerHTML="";
  (Array.isArray(notices)?notices:[])
    .filter(Boolean)
    .forEach(item=>{
      const d=document.createElement("div");
      d.className="notice-line";
      d.textContent=item;
      list.appendChild(d);
    });
}

function renderRanks(ranks,title){
  document.getElementById("rankTitle").textContent=title||"참가자";
  const list=document.getElementById("rankList");
  list.innerHTML="";
  (Array.isArray(ranks)?ranks:[])
    .filter(x=>x&&x.name)
    .forEach(item=>{
      const row=document.createElement("div");
      row.className="rank-row";

      const name=document.createElement("div");
      name.className="rank-name";
      name.textContent=item.name;

      const value=document.createElement("div");
      value.className="rank-value";
      value.textContent="("+(item.value||"")+")";

      row.append(name,value);
      list.appendChild(row);
    });
}

function showNextDonation(){
  const currentText=document.getElementById("currentText");

  if(activeDonations.length===0){
    currentText.textContent="후원 대기";
    return;
  }

  if(currentDonationIndex>=activeDonations.length){
    currentDonationIndex=0;
  }

  const item=activeDonations[currentDonationIndex];

  currentText.textContent=
    (item.name||"후원자")+" ♥ "+formatAmount(item.amount||"0").replace("원","");

  currentText.classList.remove("changing");
  void currentText.offsetWidth;
  currentText.classList.add("changing");

  currentDonationIndex++;
}

function restartRolling(seconds){
  clearInterval(rollingTimer);
  currentDonationIndex=0;
  showNextDonation();

  let s=Number(seconds);
  if(!Number.isFinite(s)||s<1)s=3;
  if(s>30)s=30;

  if(activeDonations.length>1){
    rollingTimer=setInterval(showNextDonation,s*1000);
  }
}

const firebaseConfig={
  apiKey:"AIzaSyBDZi7sRmUfh8CwM8kDiUsaQn1Kr8",
  authDomain:"broadcast-widgets.firebaseapp.com",
  databaseURL:"https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"broadcast-widgets",
  storageBucket:"broadcast-widgets.firebasestorage.app",
  messagingSenderId:"711117372939",
  appId:"1:711117372939:web:470a6f5acf88691a12510e",
  measurementId:"G-080YENY338"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();
const HUD_REF=db.ref("hud_mission_anne_gold");

HUD_REF.on("value",snapshot=>{
  const data=snapshot.val();
  if(!data)return;

  document.getElementById("accountLabel").textContent=data.accountLabel||"계좌";

  activeDonations=Array.isArray(data.donations)
    ? data.donations.filter(x=>x &&
      (String(x.name||"").trim()!=="" ||
       String(x.amount||"").trim()!==""))
    : [];

  renderNotices(data.notices,data.noticeTitle);
  renderRanks(data.ranks,data.rankTitle);
  restartRolling(data.rollingSeconds||3);
});
</script>

</body>
</html>
