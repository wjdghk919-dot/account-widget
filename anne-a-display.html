<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ANNE A - HUD DISPLAY</title>
<style>
/* =========================================================
   DISPLAY — CYBER GAME HUD
========================================================= */

.hud{
    position:absolute;
    left:55px;
    top:85px;

    width:615px;
    padding:21px 24px 24px;

    box-sizing:border-box;

    color:#fff;

    /* 투명 배경 유지 */
    background:
        linear-gradient(180deg, rgba(9,15,24,.88), rgba(7,10,16,.78));

    border:2px solid rgba(73,232,255,.78);
    border-radius:10px;

    box-shadow:
        0 0 0 1px rgba(255,55,213,.24),
        0 0 18px rgba(48,215,255,.12),
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -1px 0 rgba(255,55,213,.12);

    overflow:hidden;
}

/* 상단/하단 모서리 포인트 */
.hud::before,
.hud::after{
    content:"";
    position:absolute;
    pointer-events:none;
}

.hud::before{
    left:0;
    top:0;
    width:110px;
    height:3px;
    background:linear-gradient(90deg,#42e8ff,rgba(66,232,255,0));
    box-shadow:0 0 10px rgba(66,232,255,.45);
}

.hud::after{
    right:0;
    bottom:0;
    width:120px;
    height:3px;
    background:linear-gradient(90deg,rgba(255,48,206,0),#ff48d8);
    box-shadow:0 0 10px rgba(255,48,216,.38);
}

/* 상단 */
.hud-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    height:54px;
}

.hud-account{
    color:#50ebff;

    font-size:36px;
    font-weight:950;

    white-space:nowrap;

    text-transform:none;

    text-shadow:
        0 0 8px rgba(80,235,255,.38);
}

.hud-current{
    min-width:0;

    color:#fff;

    font-size:36px;
    font-weight:950;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-align:right;

    text-shadow:0 0 8px rgba(255,255,255,.16);
}

/* 롤링 전환 */
.hud-current.changing{
    animation:rollChange .38s ease;
}

@keyframes rollChange{
    0%{
        opacity:0;
        transform:translateY(18px);
        filter:blur(3px);
    }
    55%{
        opacity:1;
        transform:translateY(-3px);
        filter:blur(0);
    }
    100%{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}

.hud-divider{
    position:relative;
    height:2px;

    margin:15px 0 18px;

    background:linear-gradient(
        90deg,
        rgba(76,228,255,.62),
        rgba(255,255,255,.14) 55%,
        rgba(255,66,212,.52)
    );

    box-shadow:0 0 7px rgba(77,224,255,.16);
}

/* 중간 공지 */
.notice-title{
    margin-bottom:9px;

    color:#58ebff;

    font-size:36px;
    font-weight:950;

    text-shadow:0 0 8px rgba(88,235,255,.34);
}

.notice-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.notice-line{
    color:#b8f7ff;

    font-size:34px;
    line-height:1.15;
    font-weight:900;

    text-shadow:0 0 5px rgba(83,229,251,.18);
}

.notice-line::before{
    content:"▶ ";
    color:#55e8ff;
}

/* 하단 참가자 */
.rank-title{
    margin-top:21px;
    margin-bottom:12px;

    color:#ff99e7;

    font-size:36px;
    font-weight:950;

    text-shadow:0 0 8px rgba(255,108,224,.30);
}

.rank-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.rank-row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    font-size:36px;
    line-height:1.15;
    font-weight:950;
}

.rank-name{
    color:#fff;

    min-width:0;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.rank-name::before{
    content:"// ";
    color:#768696;
    font-size:.72em;
}

.rank-value{
    color:#dffbff;
    margin-left:18px;

    text-shadow:0 0 6px rgba(94,230,255,.16);
}

/* 미세한 스캔라인 — 매우 약하게 */
.hud .notice-list::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    bottom:0;
    pointer-events:none;
    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.018) 0px,
        rgba(255,255,255,.018) 1px,
        transparent 1px,
        transparent 5px
    );
    opacity:.22;
}


</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script></head><body><div class="hud">
  <div class="hud-top">
    <div class="hud-account" id="accountLabel">계좌</div>
    <div id="currentText" class="hud-current">죽밥 ♥ 100,000</div>
  </div>
  <div class="hud-divider"></div>
  <div id="noticeTitle" class="notice-title">현재미션</div>
  <div id="noticeList" class="notice-list"></div>
  <div id="rankTitle" class="rank-title">참가자</div>
  <div id="rankList" class="rank-list"></div>
</div><script>
let activeDonations=[];
let currentDonationIndex=0;
let rollingTimer=null;
let lastRollingSeconds=3;
function formatAmount(value){
  const raw=String(value).replace(/,/g,"").trim(); const n=Number(raw);
  return Number.isNaN(n)?String(value):n.toLocaleString("ko-KR")+"원";
}
function renderNotices(notices,title){
  document.getElementById("noticeTitle").textContent=title||"현재미션";
  const list=document.getElementById("noticeList"); list.innerHTML="";
  (Array.isArray(notices)?notices:[]).filter(Boolean).forEach(item=>{const d=document.createElement("div");d.className="notice-line";d.textContent=item;list.appendChild(d);});
}
function renderRanks(ranks,title){
  document.getElementById("rankTitle").textContent=title||"참가자";
  const list=document.getElementById("rankList"); list.innerHTML="";
  (Array.isArray(ranks)?ranks:[]).filter(x=>x&&x.name).forEach(item=>{
    const row=document.createElement("div");row.className="rank-row";
    const name=document.createElement("div");name.className="rank-name";name.textContent=item.name;
    const value=document.createElement("div");value.className="rank-value";value.textContent="("+(item.value||"")+")";
    row.append(name,value);list.appendChild(row);
  });
}
function showNextDonation(){
  const currentText=document.getElementById("currentText");
  if(activeDonations.length===0){currentText.textContent="후원 대기";return;}
  if(currentDonationIndex>=activeDonations.length)currentDonationIndex=0;
  const item=activeDonations[currentDonationIndex];
  currentText.textContent=(item.name||"후원자")+" ♥ "+formatAmount(item.amount||"0").replace("원","");
  currentText.classList.remove("changing");void currentText.offsetWidth;currentText.classList.add("changing");
  currentDonationIndex++;
}
function restartRolling(seconds){
  clearInterval(rollingTimer);currentDonationIndex=0;showNextDonation();
  let s=Number(seconds);if(!Number.isFinite(s)||s<1)s=3;if(s>30)s=30;lastRollingSeconds=s;
  if(activeDonations.length>1)rollingTimer=setInterval(showNextDonation,s*1000);
}
const firebaseConfig = {
  apiKey:"AIzaSyBDZi7sRmUfh8CwM8kDiUsaQn1Kr8",authDomain:"broadcast-widgets.firebaseapp.com",
  databaseURL:"https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"broadcast-widgets",
  storageBucket:"broadcast-widgets.firebasestorage.app",messagingSenderId:"711117372939",appId:"1:711117372939:web:470a6f5acf88691a12510e",measurementId:"G-080YENY338"
};
firebase.initializeApp(firebaseConfig);const db=firebase.database();const HUD_REF=db.ref("hud_mission");
HUD_REF.on("value",snapshot=>{
  const data=snapshot.val(); if(!data)return;
  document.getElementById("accountLabel").textContent=data.accountLabel||"계좌";
  activeDonations=Array.isArray(data.donations)?data.donations.filter(x=>x && (String(x.name||"").trim()!=="" || String(x.amount||"").trim()!=="")):[];
  renderNotices(data.notices,data.noticeTitle);
  renderRanks(data.ranks,data.rankTitle);
  restartRolling(data.rollingSeconds||3);
});
</script></body></html>
