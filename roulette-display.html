<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>10칸 고급 룰렛 DISPLAY</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;font-family:Arial,"Malgun Gothic",sans-serif;overflow:hidden;color:#fff}
*{box-sizing:border-box}
.wrap{position:relative;width:620px;height:760px;padding-top:28px}
.roulette{position:relative;width:560px;height:560px;margin:0 auto}
.pointer{position:absolute;z-index:20;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:30px solid #f3df9a;filter:drop-shadow(0 3px 4px rgba(0,0,0,.42))}
.wheel{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -18deg,#16191e 0deg 36deg,#252a31 36deg 72deg,#16191e 72deg 108deg,#252a31 108deg 144deg,#16191e 144deg 180deg,#252a31 180deg 216deg,#16191e 216deg 252deg,#252a31 252deg 288deg,#16191e 288deg 324deg,#252a31 324deg 360deg);border:10px solid rgba(236,215,150,.92);box-shadow:0 16px 36px rgba(0,0,0,.38),inset 0 0 0 2px rgba(255,255,255,.11),inset 0 0 0 8px rgba(0,0,0,.18);transform:rotate(0deg);transform-origin:50% 50%}
.wheel:before{content:"";position:absolute;inset:11px;border-radius:50%;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 24px rgba(255,255,255,.05)}
.wheel:after{content:"";position:absolute;inset:22px;border-radius:50%;border:1px solid rgba(238,216,158,.34);pointer-events:none}
.label{position:absolute;left:50%;top:50%;width:92px;margin-left:-46px;margin-top:-16px;text-align:center;color:#f7f2df;font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(0,0,0,.55);transform:rotate(var(--angle)) translateY(-205px) rotate(calc(var(--angle)*-1));transform-origin:center center}
.center{position:absolute;left:50%;top:280px;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#343941 0%,#15181d 55%,#0b0d10 100%);border:7px solid rgba(236,215,150,.92);box-shadow:0 0 0 4px rgba(12,14,18,.75),0 0 20px rgba(238,217,157,.28);display:flex;align-items:center;justify-content:center;z-index:10}
.centerText{font-size:30px;font-weight:900;color:#fff;text-shadow:0 2px 5px #000;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{position:absolute;left:50%;top:638px;transform:translateX(-50%);display:flex;gap:8px;z-index:50}
.quick button{width:135px;height:38px;border:0;border-radius:7px;font-size:12px;font-weight:900;cursor:pointer}
#start{background:#ead596;color:#151515} #reset{background:#2a2e34;color:#fff} #close{background:#2a2e34;color:#fff}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<div class="roulette">
<div class="pointer"></div>
<div class="wheel" id="wheel">
<div class="label" style="--angle:0deg">1</div><div class="label" style="--angle:36deg">2</div>
<div class="label" style="--angle:72deg">3</div><div class="label" style="--angle:108deg">4</div>
<div class="label" style="--angle:144deg">5</div><div class="label" style="--angle:180deg">6</div>
<div class="label" style="--angle:216deg">7</div><div class="label" style="--angle:252deg">8</div>
<div class="label" style="--angle:288deg">9</div><div class="label" style="--angle:324deg">10</div>
</div>
<div class="center"><div class="centerText" id="centerText">룰렛</div></div>
</div>
<div class="quick" id="quick">
<button id="start" onclick="sendStart()">START</button>
<button id="reset" onclick="sendReset()">RESET</button>
<button id="close" onclick="closeButtons()">CLOSE</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDZi7sRmUfh8CwM8kDiUsaQnK1r8",
  authDomain: "broadcast-widgets.firebaseapp.com",
  databaseURL: "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "broadcast-widgets",
  storageBucket: "broadcast-widgets.firebasestorage.app",
  messagingSenderId: "711117372939",
  appId: "1:711117372939:web:470a6f5acf88691a12510e",
  measurementId: "G-080YENY338"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const wheel=document.getElementById("wheel");
const centerText=document.getElementById("centerText");
const labels=[...document.querySelectorAll(".label")];
let currentRotation=0,spinning=false;
let settings={center:"룰렛",sound:"ON",slots:Array.from({length:10},(_,i)=>({label:String(i+1),prob:10}))};
function applySettings(s){
 settings=s||settings;
 centerText.textContent=settings.center||"룰렛";
 if(Array.isArray(settings.slots))settings.slots.forEach((x,i)=>{if(x)labels[i].textContent=x.label??String(i+1)});
}
function pickWinner(){
 const slots=settings.slots||[];
 let total=slots.reduce((a,x)=>a+Math.max(0,Number(x?.prob)||0),0);
 if(total<=0)return Math.floor(Math.random()*10);
 let r=Math.random()*total;
 for(let i=0;i<10;i++){r-=Math.max(0,Number(slots[i]?.prob)||0);if(r<0)return i;}
 return 9;
}
function doSpin(){
 if(spinning)return;
 spinning=true;
 document.getElementById("start").disabled=true;
 const winner=pickWinner(), step=36;
 const target=((-(winner*step))%360+360)%360;
 const current=((currentRotation%360)+360)%360;
 let delta=target-current;if(delta<0)delta+=360;
 const turns=8+Math.floor(Math.random()*4);
 const finalRotation=currentRotation+turns*360+delta;
 wheel.style.transition="transform 5s cubic-bezier(0.10,0.74,0.16,1)";
 wheel.style.transform="rotate("+finalRotation+"deg)";
 currentRotation=finalRotation;
 setTimeout(()=>{spinning=false;document.getElementById("start").disabled=false;centerText.textContent=labels[winner].textContent.trim()||"결과";},5050);
}
function doReset(){
 if(spinning)return;
 wheel.style.transition="none";currentRotation=0;wheel.style.transform="rotate(0deg)";
 centerText.textContent=settings.center||"룰렛";
}
function sendStart(){db.ref("roulette_10/command").set({type:"start",at:Date.now()})}
function sendReset(){db.ref("roulette_10/command").set({type:"reset",at:Date.now()})}
function closeButtons(){document.getElementById("quick").classList.add("hidden")}
db.ref("roulette_10/settings").on("value",s=>applySettings(s.val()));
let lastCommand=0;
db.ref("roulette_10/command").on("value",s=>{
 const c=s.val();if(!c||c.at===lastCommand)return;lastCommand=c.at;
 if(c.type==="start")doSpin(); else if(c.type==="reset")doReset();
});
applySettings(settings);
</script>
</body>
</html>
