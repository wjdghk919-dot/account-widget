<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고정 계좌 안내 CONTROL</title>
<style>
html,body{
    margin:0;
    padding:0;
    background:#111;
    font-family:Arial,sans-serif;
    color:#fff;
}
.control{
    width:430px;
    margin:30px;
    padding:18px;
    box-sizing:border-box;
    background:#18191d;
    border:1px solid #555;
    border-radius:12px;
    box-shadow:0 12px 28px rgba(0,0,0,.35);
}
.control h2{
    margin:0 0 16px;
    font-size:21px;
}
.field{margin-bottom:11px}
.field label{
    display:block;
    margin-bottom:5px;
    color:#aaa;
    font-size:12px;
}
.field input{
    width:100%;
    height:34px;
    box-sizing:border-box;
    padding:0 10px;
    border:1px solid #777;
    border-radius:5px;
    font-size:15px;
}
.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.buttons{
    display:flex;
    gap:8px;
    margin-top:14px;
}
button{
    height:36px;
    padding:0 15px;
    border:0;
    border-radius:6px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
}
.apply-button{
    background:#d8b84c;
    color:#111;
}
.reset-button{
    background:#777;
    color:#fff;
}
.status{
    margin-top:12px;
    color:#9fdc89;
    font-size:12px;
}
.note{
    margin-top:10px;
    color:#888;
    font-size:11px;
    line-height:1.4;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body>
<div class="control">
    <h2>고정 계좌 안내 CONTROL</h2>

    <div class="field">
        <label>은행</label>
        <input id="bankInput" type="text" value="카카오뱅크">
    </div>

    <div class="row">
        <div class="field">
            <label>이름 이니셜</label>
            <input id="initialInput" type="text" value="JH">
        </div>

        <div class="field">
            <label>계좌번호</label>
            <input id="accountInput" type="text" value="3333-04-9692388">
        </div>
    </div>

    <div class="buttons">
        <button class="apply-button" onclick="applyAccount()">APPLY</button>
        <button class="reset-button" onclick="resetAccount()">RESET</button>
    </div>

    <div id="status" class="status">Firebase 연결 중...</div>

    <div class="note">
        방송용 DISPLAY는 별도 웹페이지입니다.<br>
        은행명·이니셜·계좌번호만 바꾸고 APPLY를 누르면 DISPLAY에 반영됩니다.
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBDZi7sRmUfh8CwM8kDiUsaQn1Kr8",
    authDomain: "broadcast-widgets.firebaseapp.com",
    databaseURL: "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "broadcast-widgets",
    storageBucket: "broadcast-widgets.firebasestorage.app",
    messagingSenderId: "711117372939",
    appId: "1:711117372939:web:470a6f5acf88691a12510e",
    measurementId: "G-080YENY338"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const REF = db.ref("fixed_account_guide");

function setStatus(message, ok=true){
    const el = document.getElementById("status");
    el.textContent = message;
    el.style.color = ok ? "#9fdc89" : "#ff8f8f";
}

function applyAccount(){
    const data = {
        bank: document.getElementById("bankInput").value.trim(),
        initial: document.getElementById("initialInput").value.trim(),
        account: document.getElementById("accountInput").value.trim()
    };

    REF.set(data)
        .then(() => setStatus("저장 완료 · DISPLAY에 실시간 반영됨"))
        .catch((error) => {
            console.error(error);
            setStatus("Firebase 저장 실패", false);
        });
}

function resetAccount(){
    document.getElementById("bankInput").value = "카카오뱅크";
    document.getElementById("initialInput").value = "JH";
    document.getElementById("accountInput").value = "3333-04-9692388";
    applyAccount();
}

REF.on("value", (snapshot) => {
    if(snapshot.exists()){
        const data = snapshot.val() || {};
        if(data.bank !== undefined) document.getElementById("bankInput").value = data.bank;
        if(data.initial !== undefined) document.getElementById("initialInput").value = data.initial;
        if(data.account !== undefined) document.getElementById("accountInput").value = data.account;
        setStatus("Firebase 연결됨 · 실시간 동기화 중");
    }else{
        setStatus("Firebase 연결됨 · 아직 저장된 데이터 없음");
    }
}, (error) => {
    console.error(error);
    setStatus("Firebase 연결 오류", false);
});
</script>
</body>
</html>
