<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>10칸 고급 룰렛 CONTROL</title>
<style>
html,body{margin:0;padding:0;background:transparent;font-family:Arial,"Malgun Gothic",sans-serif;color:#fff}
*{box-sizing:border-box}
.control{width:560px;margin:18px auto;padding:14px 16px;border-radius:12px;background:rgba(18,21,27,.96);border:1px solid rgba(238,216,158,.34);box-shadow:0 10px 26px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08)}
h2{margin:0 0 10px;font-size:17px;color:#f4e8c3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.field{display:flex;align-items:center;gap:8px;min-width:0}
.field label{width:64px;flex:none;color:#a9a9ad;font-size:11px}
.field input{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid #555a62;border-radius:5px;background:#0d1015;color:#fff;font-size:12px;outline:none}
.field input:focus{border-color:#dcc98d}
.prob{max-width:62px}
.buttons{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
button{height:34px;padding:0 15px;border:0;border-radius:6px;font-size:12px;font-weight:900;cursor:pointer}
.start{background:#ead596;color:#151515} .apply{background:#d8dce0;color:#17191d} .reset{background:#51565d;color:#fff}
.note{margin-top:8px;color:#777d84;font-size:10px;line-height:1.4}
.status{margin-top:8px;color:#aeb3ba;font-size:11px}
.total{font-size:11px;color:#f0e1ad;margin-top:8px}
</style>
</head>
<body>
<div class="control">
<h2>10칸 룰렛 CONTROL</h2>
<div class="grid">
<div class="field"><label>중앙 문구</label><input id="centerInput" maxlength="6" value="룰렛"></div>
<div class="field"><label>회전시간</label><input value="5초 고정" disabled></div>
<div class="field"><label>사운드</label><input id="soundInput" value="ON"></div>
<div class="field"><label>상태</label><input id="stateInput" value="대기 중" disabled></div>
<div class="field"><label>1번</label><input id="slot1" value="1"><input class="prob" id="prob1" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>2번</label><input id="slot2" value="2"><input class="prob" id="prob2" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>3번</label><input id="slot3" value="3"><input class="prob" id="prob3" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>4번</label><input id="slot4" value="4"><input class="prob" id="prob4" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>5번</label><input id="slot5" value="5"><input class="prob" id="prob5" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>6번</label><input id="slot6" value="6"><input class="prob" id="prob6" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>7번</label><input id="slot7" value="7"><input class="prob" id="prob7" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>8번</label><input id="slot8" value="8"><input class="prob" id="prob8" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>9번</label><input id="slot9" value="9"><input class="prob" id="prob9" type="number" min="0" max="100" value="10"></div>
<div class="field"><label>10번</label><input id="slot10" value="10"><input class="prob" id="prob10" type="number" min="0" max="100" value="10"></div>
</div>
<div class="total">확률 합계: <span id="total">100</span>%</div>
<div class="buttons">
<button class="apply" onclick="applySettings()">APPLY</button>
<button class="start" onclick="sendStart()">START</button>
<button class="reset" onclick="sendReset()">RESET</button>
</div>
<div class="note">확률 합계가 100%일 때 APPLY가 저장됩니다. DISPLAY에서도 START / RESET이 그대로 작동합니다.</div>
<div class="status" id="status">Firebase 연결 준비 중...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDZi7sRmUfh8CwM8kDiUsaQnK1r8",
  authDomain: "broadcast-widgets.firebaseapp.com",
  databaseURL: "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "broadcast-widgets",
  storageBucket: "broadcast-widgets.firebasestorage.app",
  messagingSenderId: "711117372939",
  appId: "1:711117372939:web:470a6f5acf88691a12510e",
  measurementId: "G-080YENY338"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const ref=db.ref("roulette_10");

function readSettings(){
  const slots=[];
  let total=0;
  for(let i=1;i<=10;i++){
    const label=document.getElementById("slot"+i).value.trim()||String(i);
    const prob=Math.max(0,Number(document.getElementById("prob"+i).value)||0);
    slots.push({label,prob});
    total+=prob;
  }
  return {center:document.getElementById("centerInput").value.trim()||"룰렛",sound:document.getElementById("soundInput").value.trim()||"ON",slots,total};
}
function updateTotal(){
  let t=0;
  for(let i=1;i<=10;i++) t+=Math.max(0,Number(document.getElementById("prob"+i).value)||0);
  document.getElementById("total").textContent=t;
}
document.querySelectorAll(".prob").forEach(e=>e.addEventListener("input",updateTotal));

function applySettings(){
  const s=readSettings();
  if(s.total!==100){
    alert("확률 합계가 "+s.total+"%입니다. 100%가 되도록 맞춰주세요.");
    return;
  }
  db.ref("roulette_10/settings").set({center:s.center,sound:s.sound,slots:s.slots})
    .then(()=>document.getElementById("status").textContent="설정 저장 완료 · Firebase 실시간 동기화");
}
function sendStart(){ db.ref("roulette_10/command").set({type:"start",at:Date.now()}); }
function sendReset(){ db.ref("roulette_10/command").set({type:"reset",at:Date.now()}); }

db.ref("roulette_10/settings").on("value",snap=>{
  const d=snap.val(); if(!d)return;
  if(d.center!==undefined)document.getElementById("centerInput").value=d.center;
  if(d.sound!==undefined)document.getElementById("soundInput").value=d.sound;
  if(Array.isArray(d.slots))d.slots.forEach((x,i)=>{
    if(x){document.getElementById("slot"+(i+1)).value=x.label??String(i+1);document.getElementById("prob"+(i+1)).value=x.prob??10;}
  });
  updateTotal();
});
db.ref(".info/connected").on("value",s=>document.getElementById("status").textContent=s.val()?"Firebase 연결됨 · 실시간 동기화":"Firebase 연결 대기 중");
</script>
</body>
</html>
