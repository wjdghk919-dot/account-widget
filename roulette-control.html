<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10칸 고급 룰렛 - CONTROL</title>
<style>
html,body{margin:0;padding:0;width:100%;min-height:100%;background:transparent;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;overflow-y:auto;color:#fff}
*{box-sizing:border-box}
.wrap{position:relative;width:100%;max-width:620px;min-height:0;margin:0 auto;padding:10px 0 22px}
.roulette{position:relative;width:min(560px,92vw);height:min(560px,92vw);margin:0 auto}
.pointer{position:absolute;z-index:20;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:30px solid #f3df9a;filter:drop-shadow(0 3px 4px rgba(0,0,0,.42)) drop-shadow(0 0 7px rgba(243,223,154,.22))}
.pointer:after{content:"";position:absolute;left:-8px;top:22px;width:16px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);filter:blur(2px)}
.wheel{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -18deg,#16191e 0deg 36deg,#252a31 36deg 72deg,#16191e 72deg 108deg,#252a31 108deg 144deg,#16191e 144deg 180deg,#252a31 180deg 216deg,#16191e 216deg 252deg,#252a31 252deg 288deg,#16191e 288deg 324deg,#252a31 324deg 360deg);border:10px solid rgba(236,215,150,.92);box-shadow:0 16px 36px rgba(0,0,0,.38),inset 0 0 0 2px rgba(255,255,255,.11),inset 0 0 0 8px rgba(0,0,0,.18);transform:rotate(0deg);transform-origin:50% 50%}
.wheel:before{content:"";position:absolute;inset:11px;border-radius:50%;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 24px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.24)}
.wheel:after{content:"";position:absolute;inset:22px;border-radius:50%;border:1px solid rgba(238,216,158,.34);pointer-events:none}
.label{
    position:absolute;
    left:50%;
    top:50%;

    width:112px;
    height:44px;

    margin-left:-56px;
    margin-top:-22px;

    display:flex;
    align-items:center;
    justify-content:center;

    transform:
        rotate(var(--angle))
        translateY(-205px);

    transform-origin:center center;
    pointer-events:none;
}

.label span{
    display:block;
    width:100%;

    text-align:center;

    color:#f7f2df;
    font-size:22px;
    font-weight:800;
    letter-spacing:-.4px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    text-shadow:
        0 2px 4px rgba(0,0,0,.55),
        0 0 7px rgba(255,255,255,.06);

    transform:none;
}


.label:nth-child(even) span{color:#fff}
.label:after{content:"";position:absolute;left:50%;bottom:-13px;width:42px;height:1px;transform:translateX(-50%);background:rgba(238,216,158,.35)}
.center{position:absolute;z-index:10;left:50%;top:50%;width:178px;height:178px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.12),rgba(255,255,255,0) 42%),rgba(16,19,24,.94);border:5px solid rgba(239,216,151,.92);box-shadow:0 9px 20px rgba(0,0,0,.42),inset 0 0 0 2px rgba(255,255,255,.10),inset 0 0 28px rgba(255,255,255,.04),0 0 18px rgba(235,214,151,.11)}
.center:before{content:"";position:absolute;inset:9px;border-radius:50%;border:1px solid rgba(255,255,255,.16)}
.centerText{position:relative;z-index:2;width:135px;text-align:center;color:#fffdf3;font-size:32px;font-weight:900;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 7px rgba(0,0,0,.45)}
.hub{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#e8d69b;box-shadow:0 0 0 4px rgba(12,14,18,.75),0 0 11px rgba(238,217,157,.28)}

/* ===== probability control: compact & no overflow ===== */
.control{
    width:min(560px,92vw);
    margin:10px auto 0;
    padding:12px 14px;
    border-radius:12px;
    background:rgba(18,21,27,.90);
    border:1px solid rgba(238,216,158,.34);
    box-shadow:
        0 10px 26px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.08);
}

.control h2{
    margin:0 0 8px;
    font-size:16px;
    color:#f4e8c3;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px 10px;
}

.field{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
}

.field label{
    width:42px;
    flex:none;
    color:#a9a9ad;
    font-size:10px;
}

.field input{
    flex:1;
    min-width:0;
    height:28px;
    padding:0 7px;
    border:1px solid #555a62;
    border-radius:5px;
    background:#0d1015;
    color:#fff;
    font-size:12px;
    outline:none;
}

.field input:focus{
    border-color:#dcc98d;
}

.slot-field{
    gap:4px;
}

.slot-field .slotInput{
    flex:1 1 auto;
    min-width:0;
}

.probInput{
    width:44px !important;
    flex:0 0 44px !important;
    text-align:center;
    padding:0 3px !important;
    font-size:11px !important;
}

.prob-unit{
    width:8px;
    flex:0 0 8px;
    color:#aaa;
    font-size:10px;
    text-align:center;
}

.prob-total{
    margin-top:6px;
    min-height:16px;
    color:#ff9e93;
    font-size:10px;
    font-weight:900;
}

.prob-total.ok{
    color:#bfe88b;
}

.buttons{
    display:flex;
    gap:6px;
    flex-wrap:nowrap;
    margin-top:7px;
}

button{
    height:32px;
    padding:0 14px;
    border:0;
    border-radius:6px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
}

.note{
    margin-top:6px;
    color:#777d84;
    font-size:9px;
    line-height:1.25;
}

@media (max-width:600px){
    .wrap{
        width:100%;
        padding:8px 0 20px;
    }
    .roulette{
        width:92vw;
        height:92vw;
        max-width:none;
        max-height:none;
    }
    .label{
        transform:
            rotate(var(--angle))
            translateY(-33vw);
    }
    .label span{
        transform:none;
    }
    .center{
        width:29vw;
        height:29vw;
        min-width:132px;
        min-height:132px;
        max-width:178px;
        max-height:178px;
    }
    .centerText{
        width:24vw;
        max-width:135px;
        font-size:clamp(24px,5.8vw,32px);
    }
    .hub{width:18px;height:18px}
    .control{
        width:92vw;
        padding:10px 10px;
    }
    .grid{
        grid-template-columns:1fr;
        gap:5px;
    }
    .buttons{
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
    }
}
@media (max-width:380px){
    .roulette{width:90vw;height:90vw}
    .label{transform:rotate(var(--angle)) translateY(-32vw)}
    .label span{transform:none}
    .center{width:28vw;height:28vw;min-width:124px;min-height:124px}
    .centerText{font-size:clamp(22px,5.6vw,30px)}
}
/* ===== RESULT ACTION ===== */
.centerText{
    transition:transform .16s ease, filter .16s ease, text-shadow .16s ease;
}

.center.result-pop .centerText{
    animation:resultPop .65s cubic-bezier(.18,.88,.28,1.25);
}

.center.result-pop{
    animation:centerGlow .65s ease;
}

@keyframes resultPop{
    0%{
        transform:scale(.72);
        opacity:.35;
        filter:blur(4px);
    }
    48%{
        transform:scale(1.16);
        opacity:1;
        filter:blur(0);
    }
    72%{
        transform:scale(.96);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes centerGlow{
    0%{
        box-shadow:
            0 9px 20px rgba(0,0,0,.42),
            inset 0 0 0 2px rgba(255,255,255,.10),
            inset 0 0 28px rgba(255,255,255,.04),
            0 0 18px rgba(235,214,151,.11);
    }
    40%{
        box-shadow:
            0 10px 24px rgba(0,0,0,.42),
            inset 0 0 0 2px rgba(255,255,255,.16),
            inset 0 0 32px rgba(255,255,255,.08),
            0 0 38px rgba(239,216,151,.42);
    }
    100%{
        box-shadow:
            0 9px 20px rgba(0,0,0,.42),
            inset 0 0 0 2px rgba(255,255,255,.10),
            inset 0 0 28px rgba(255,255,255,.04),
            0 0 18px rgba(235,214,151,.11);
    }
}

.result-flash{
    animation:resultFlash .55s ease;
}

@keyframes resultFlash{
    0%{opacity:0}
    35%{opacity:1}
    100%{opacity:0}
}

.sound-status{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:7px;
    color:#aaa;
    font-size:10px;
}

.sound-status input{
    width:15px;
    height:15px;
    margin:0;
    flex:none;
}


/* ===== PHONE QUICK BUTTONS ===== */
.quickButtons{
    width:min(420px,78vw);
    margin:7px auto 0;
    display:flex;
    gap:7px;
    justify-content:center;
}
.quickButtons button{
    height:38px;
    flex:1;
    max-width:150px;
    border-radius:8px;
    border:1px solid rgba(238,216,158,.45);
    font-size:12px;
    font-weight:900;
    letter-spacing:.3px;
}
.quickStart{
    background:linear-gradient(180deg,#f3df9a,#c8a75a);
    color:#11151a;
    box-shadow:0 5px 14px rgba(0,0,0,.28);
}
.quickReset{
    background:rgba(33,36,43,.94);
    color:#f7f2df;
    box-shadow:0 5px 14px rgba(0,0,0,.24);
}
.quickEdit{
    background:rgba(16,19,24,.92);
    color:#f4e8c3;
}
@media (max-width:600px){
    .quickButtons{width:88vw;max-width:360px}
    .quickButtons button{
        height:40px;
        min-width:0;
        padding:0 8px;
        font-size:11px;
    }
}


.centerText{transition:transform .18s ease,filter .18s ease,text-shadow .18s ease}
.center.result-pop .centerText{
    animation:resultTextImpact .9s cubic-bezier(.16,.84,.22,1.12);
}
.center.result-pop{
    animation:centerImpact .9s ease;
}
.center.result-pop:after{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:2px solid rgba(255,240,180,.85);
    opacity:0;
    animation:resultRing .8s ease-out;
}
.label.winner{
    z-index:30;
    filter:drop-shadow(0 0 8px rgba(243,223,154,.55));
}
.label.winner span{
    animation:winnerTextImpact .85s cubic-bezier(.16,.84,.22,1.08);
}
@keyframes resultTextImpact{
    0%{transform:scale(.62);opacity:0;filter:blur(7px)}
    30%{transform:scale(1.28);opacity:1;filter:blur(0)}
    55%{transform:scale(.90)}
    76%{transform:scale(1.08)}
    100%{transform:scale(1)}
}
@keyframes winnerTextImpact{
    0%{transform:scale(.82)}
    30%{transform:scale(1.26);text-shadow:0 0 22px rgba(255,241,174,.98),0 0 42px rgba(255,241,174,.5)}
    58%{transform:scale(.94)}
    100%{transform:scale(1);text-shadow:0 2px 4px rgba(0,0,0,.55),0 0 7px rgba(255,255,255,.07)}
}
@keyframes centerImpact{
    0%{box-shadow:0 9px 20px rgba(0,0,0,.42),inset 0 0 0 2px rgba(255,255,255,.10),inset 0 0 28px rgba(255,255,255,.04),0 0 18px rgba(235,214,151,.11)}
    35%{box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.23),inset 0 0 42px rgba(255,255,255,.12),0 0 62px rgba(255,224,145,.82)}
    100%{box-shadow:0 9px 20px rgba(0,0,0,.42),inset 0 0 0 2px rgba(255,255,255,.10),inset 0 0 28px rgba(255,255,255,.04),0 0 18px rgba(235,214,151,.11)}
}
@keyframes resultRing{
    0%{transform:scale(.76);opacity:0}
    18%{opacity:1}
    100%{transform:scale(1.28);opacity:0}
}

.toggle{display:none}

@media (max-width:600px){
    .control{
        display:block !important;
        width:92vw;
        margin:9px auto 0;
        padding:10px;
    }
    .control h2{
        font-size:15px;
        margin-bottom:7px;
    }
    .grid{
        grid-template-columns:1fr;
        gap:5px;
    }
    .field input{
        height:30px;
        font-size:12px;
    }
    .buttons{
        display:grid;
        grid-template-columns:1fr 1fr 1fr;
        gap:5px;
    }
    .buttons button{
        min-width:0;
        padding:0 6px;
    }
    .quickButtons{
        margin-bottom:5px;
    }
}


/* ===== CLEAN PLAY MODE ===== */
.controlToggleFixed{
    position:fixed;
    z-index:100;
    top:10px;
    right:10px;
    height:32px;
    min-width:88px;
    padding:0 12px;
    border:1px solid rgba(238,216,158,.5);
    border-radius:7px;
    background:rgba(16,19,24,.9);
    color:#f4e8c3;
    font-size:11px;
    font-weight:900;
    letter-spacing:.3px;
    cursor:pointer;
    box-shadow:0 5px 16px rgba(0,0,0,.25);
}
body.play-mode .wrap{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:42px 0 18px;
}
body.play-mode .roulette{
    width:min(560px,92vw);
    height:min(560px,92vw);
    flex:none;
}
body.play-mode .quickButtons{
    margin-top:8px;
}
body.play-mode .control{
    display:none !important;
}

@media (max-width:600px){
    body.play-mode .wrap{
        min-height:100svh;
        padding:42px 0 18px;
    }
    body.play-mode .roulette{
        width:92vw;
        height:92vw;
    }
    body.play-mode .quickButtons{
        width:72vw;
        max-width:300px;
        margin-top:8px;
    }
}


/* ===== PLAYER BUTTONS: FORCE VISIBLE ===== */
body.play-mode .quickButtons{
    display:flex !important;
    visibility:visible !important;
    opacity:1 !important;
    position:relative !important;
    z-index:200 !important;
    width:min(88vw,360px) !important;
    margin:10px auto 0 !important;
    pointer-events:auto !important;
}
body.play-mode .quickButtons button{
    display:block !important;
    visibility:visible !important;
    opacity:1 !important;
    pointer-events:auto !important;
}
body.play-mode .quickStart,
body.play-mode .quickReset,
body.play-mode .quickEdit{
    display:block !important;
}
body.play-mode .control,
body.play-mode .toggle{
    display:none !important;
}

@media (max-width:600px){
    body.play-mode .quickButtons{
        width:88vw !important;
        max-width:360px !important;
        gap:6px !important;
    }
    body.play-mode .quickButtons button{
        flex:1 1 0 !important;
        min-width:0 !important;
        height:42px !important;
        padding:0 4px !important;
        font-size:11px !important;
    }
}


.controlToggleFixed{
    position:fixed !important;
    z-index:9999 !important;
    display:block !important;
    visibility:visible !important;
}


/* ===== FINAL PLAY LAYOUT ===== */
body.play-mode .wrap{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:24px 0 22px;
}
body.play-mode .roulette{
    flex:0 0 auto;
}
body.play-mode .quickButtons{
    flex:0 0 auto;
    display:flex !important;
    visibility:visible !important;
}
@media (max-width:600px){
    body.play-mode .wrap{
        min-height:100svh;
        padding:22px 0 18px;
    }
    body.play-mode .quickButtons{
        width:88vw !important;
        max-width:360px !important;
        gap:6px !important;
        margin-top:9px !important;
    }
    body.play-mode .quickButtons button{
        flex:1 1 0 !important;
        min-width:0 !important;
        height:42px !important;
        padding:0 4px !important;
        font-size:11px !important;
    }
}

</style>

<body>
<div class="wrap">
<div class="control" id="control">
<h2>10칸 룰렛 CONTROL</h2>
<div class="grid">
<div class="field"><label>중앙 문구</label><input id="centerInput" type="text" maxlength="6" value="룰렛"></div>
<div class="field"><label>회전시간</label><input type="text" value="5초 고정" disabled></div>
<div class="field"><label>사운드</label><div class="sound-status"><input id="soundInput" type="checkbox" checked><span>ON</span></div></div>
<div class="field slot-field"><label>1번</label><input class="slotInput" type="text" maxlength="8" value="1"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>2번</label><input class="slotInput" type="text" maxlength="8" value="2"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>3번</label><input class="slotInput" type="text" maxlength="8" value="3"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>4번</label><input class="slotInput" type="text" maxlength="8" value="4"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>5번</label><input class="slotInput" type="text" maxlength="8" value="5"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>6번</label><input class="slotInput" type="text" maxlength="8" value="6"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>7번</label><input class="slotInput" type="text" maxlength="8" value="7"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>8번</label><input class="slotInput" type="text" maxlength="8" value="8"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>9번</label><input class="slotInput" type="text" maxlength="8" value="9"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
<div class="field slot-field"><label>10번</label><input class="slotInput" type="text" maxlength="8" value="10"><input class="probInput" type="number" min="0" max="100" step="0.1" value="10"><span class="prob-unit">%</span></div>
</div>
<script>


const firebaseConfig = {
  apiKey: "AIzaSyBDZi7sRmUfh8CwM8kDiUsaQn1Kr8",
  authDomain: "broadcast-widgets.firebaseapp.com",
  databaseURL: "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "broadcast-widgets",
  storageBucket: "broadcast-widgets.firebasestorage.app",
  messagingSenderId: "711117372939",
  appId: "1:711117372939:web:470a6f5acf88691a12510e",
  measurementId: "G-080YENY338"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROULETTE_REF = db.ref("roulette");


const SLOT_COUNT = 10;
const centerInput = document.getElementById("centerInput");
const slotInputs = [...document.querySelectorAll(".slotInput")];
const probInputs = [...document.querySelectorAll(".probInput")];
const probTotal = document.getElementById("probTotal");
const soundInput = document.getElementById("soundInput");

const statusEl = document.createElement("div");
statusEl.style.cssText = "margin-top:7px;color:#a9a9ad;font-size:10px;";
statusEl.textContent = "Firebase 연결 중...";
document.getElementById("control").appendChild(statusEl);

function validateProbabilities(){
    const total = probInputs.reduce((sum, input) => {
        const v = Number(input.value);
        return sum + (Number.isFinite(v) && v >= 0 ? Math.min(v,100) : 0);
    }, 0);

    const rounded = Math.round(total * 10) / 10;
    probTotal.textContent = "확률 합계: " + rounded.toLocaleString("ko-KR") + "%";
    const valid = Math.abs(total - 100) < 0.0001;
    probTotal.classList.toggle("ok", valid);
    return valid;
}

function collectSettings(){
    return {
        centerText: centerInput.value.trim() || "룰렛",
        soundEnabled: !!soundInput.checked,
        slots: slotInputs.map((input, i) => ({
            label: input.value.trim() || String(i + 1),
            prob: Math.max(0, Math.min(100, Number(probInputs[i].value) || 0))
        })),
        updatedAt: Date.now()
    };
}

function saveSettings(){
    if(!validateProbabilities()){
        alert("확률 합계를 정확히 100%로 맞춰주세요.");
        return;
    }
    ROULETTE_REF.update({
        ...collectSettings(),
        command: "none"
    }).then(() => {
        statusEl.textContent = "저장 완료 · DISPLAY에 실시간 반영";
    }).catch(err => {
        statusEl.textContent = "저장 오류: " + err.message;
    });
}

function weightedWinner(settings){
    const r = Math.random() * 100;
    let cumulative = 0;
    for(let i=0;i<settings.slots.length;i++){
        cumulative += Number(settings.slots[i].prob) || 0;
        if(r < cumulative) return i;
    }
    return settings.slots.length - 1;
}

function sendSpin(){
    if(!validateProbabilities()){
        alert("확률 합계를 정확히 100%로 맞춰주세요.");
        return;
    }
    const settings = collectSettings();
    const winnerIndex = weightedWinner(settings);

    ROULETTE_REF.update({
        ...settings,
        command: "spin",
        winnerIndex,
        commandId: Date.now().toString() + "-" + Math.random().toString(36).slice(2),
        commandAt: Date.now()
    }).then(() => {
        statusEl.textContent = "START 전송 완료 · DISPLAY에서 룰렛 실행";
    }).catch(err => {
        statusEl.textContent = "전송 오류: " + err.message;
    });
}

function sendReset(){
    ROULETTE_REF.update({
        ...collectSettings(),
        command: "reset",
        commandId: Date.now().toString() + "-" + Math.random().toString(36).slice(2),
        commandAt: Date.now()
    }).then(() => {
        statusEl.textContent = "RESET 전송 완료 · DISPLAY 초기화";
    }).catch(err => {
        statusEl.textContent = "전송 오류: " + err.message;
    });
}

probInputs.forEach(input => {
    input.addEventListener("input", validateProbabilities);
    input.addEventListener("change", validateProbabilities);
});

ROULETTE_REF.on("value", snapshot => {
    const data = snapshot.val();
    if(!data){
        statusEl.textContent = "Firebase 연결됨 · 아직 저장된 설정 없음";
        return;
    }

    statusEl.textContent = "Firebase 연결됨 · 실시간 동기화 중";

    if(data.centerText !== undefined) centerInput.value = data.centerText;
    if(data.soundEnabled !== undefined) soundInput.checked = !!data.soundEnabled;

    if(Array.isArray(data.slots)){
        data.slots.forEach((slot, i) => {
            if(slotInputs[i] && slot.label !== undefined) slotInputs[i].value = slot.label;
            if(probInputs[i] && slot.prob !== undefined) probInputs[i].value = slot.prob;
        });
    }

    validateProbabilities();
});
validateProbabilities();

</script>
