<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후원 알림</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* =========================================================
   방송용 DISPLAY
========================================================= */

.display {
    position: absolute;
    left: 30px;
    top: 30px;

    width: 380px;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 10px;
}

/* ---------------------------------------------------------
   1. 후원자 알림 - 위쪽 캡슐
--------------------------------------------------------- */

.donor-alert {
    min-width: 290px;
    max-width: 360px;

    padding: 9px 16px;

    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;

    background: rgba(20, 21, 25, .84);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 24px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08);

    font-size: 17px;
    font-weight: 900;

    opacity: 0;
    transform: translateY(-16px) scale(.95);

    pointer-events: none;

    transition:
        opacity .28s ease,
        transform .28s ease;
}

.donor-alert.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.donor-alert .event {
    color: #f5f5f5;
}

.donor-alert .arrow {
    margin: 0 7px;
    color: #d7d7d7;
}

/* ---------------------------------------------------------
   2. 계좌 후원 금액 카드
--------------------------------------------------------- */

.account-alert {
    width: 240px;
    padding: 11px 16px 13px;

    box-sizing: border-box;

    text-align: center;

    color: #111;

    background:
        linear-gradient(
            180deg,
            rgba(255,216,61,.94) 0%,
            rgba(255,182,0,.86) 100%
        );

    border: 2px solid rgba(255,243,165,.88);

    border-radius: 15px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.38);

    opacity: 0;
    transform: translateY(12px) scale(.94);

    pointer-events: none;

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.account-alert.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.account-title {
    font-size: 14px;
    font-weight: 900;

    margin-bottom: 1px;
}

.account-amount {
    font-size: 48px;
    line-height: 1.05;
    font-weight: 900;

    letter-spacing: -1px;
}

/* =========================================================
   CONTROL
========================================================= */

.control {
    position: absolute;

    left: 30px;
    top: 240px;

    width: 430px;

    padding: 18px;

    box-sizing: border-box;

    color: #fff;

    background: #18191d;

    border: 1px solid #555;
    border-radius: 12px;

    box-shadow:
        0 12px 28px rgba(0,0,0,.35);
}

.control h2 {
    margin: 0 0 15px;

    font-size: 20px;
}

.field {
    margin-bottom: 11px;
}

.field label {
    display: block;

    margin-bottom: 5px;

    color: #aaa;

    font-size: 12px;
}

.field input {
    width: 100%;
    height: 34px;

    box-sizing: border-box;

    padding: 0 10px;

    border: 1px solid #777;
    border-radius: 5px;

    font-size: 15px;
}

.row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.buttons {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 14px;
}

button {
    height: 36px;

    padding: 0 14px;

    border: 0;
    border-radius: 6px;

    font-size: 13px;
    font-weight: 900;

    cursor: pointer;
}

.primary {
    background: #d8b84c;
    color: #111;
}

.secondary {
    background: #fff;
    color: #111;
}

.dark {
    background: #666;
    color: #fff;
}

.note {
    margin-top: 10px;

    color: #888;

    font-size: 11px;
    line-height: 1.4;
}

/* 자동 숨김 */
.status {
    margin-top: 10px;

    color: #aaa;

    font-size: 12px;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDZi7sRmUfh8CwM8kDiUsaQnK1r8",
  authDomain: "broadcast-widgets.firebaseapp.com",
  databaseURL: "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "broadcast-widgets",
  storageBucket: "broadcast-widgets.firebasestorage.app",
  messagingSenderId: "711117372939",
  appId: "1:711117372939:web:470a6f5acf88691a12510e",
  measurementId: "G-080YENY338"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const DONATION_REF = db.ref("donation_alert");
</script>

</head>
<body>

<!-- CONTROL -->
<div id="controlPanel" class="control">
    <h2>후원 알림 CONTROL</h2>
    <div class="field">
        <label>시그 / 이벤트</label>
        <input id="eventInput" type="text" value="~팅커벨">
    </div>
    <div class="field">
        <label>후원자</label>
        <input id="donorInput" type="text" value="김종독">
    </div>
    <div class="field">
        <label>계좌 후원 금액</label>
        <input id="amountInput" type="text" value="62000">
    </div>
    <div class="row">
        <div class="field">
            <label>유지시간 (초)</label>
            <input id="durationInput" type="number" min="1" max="30" value="3">
        </div>
        <div class="field">
            <label>숫자 연출</label>
            <input id="countDurationInput" type="number" min="0" max="5000" step="100" value="900">
        </div>
    </div>
    <div class="buttons">
        <button class="primary" onclick="sendTrigger('donor')">후원자 알림</button>
        <button class="primary" onclick="sendTrigger('account')">계좌후원</button>
        <button class="secondary" onclick="sendTrigger('both')">둘 다</button>
        <button class="dark" onclick="sendTrigger('hide')">HIDE</button>
    </div>
    <div class="buttons">
        <button class="primary" onclick="saveSettings()">설정 저장</button>
    </div>
    <div id="status" class="status">Firebase 연결 중...</div>
</div>


<script>
const statusEl = document.getElementById("status");
const defaults = {event:"~팅커벨", donor:"김종독", amount:62000, duration:3, countDuration:900};

DONATION_REF.on("value", snap => {
  const d = snap.val();
  statusEl.textContent = d ? "Firebase 연결됨 · 실시간 동기화 중" : "Firebase 연결됨 · 아직 저장된 데이터 없음";
  if (!d) return;
  if (d.event !== undefined) document.getElementById("eventInput").value = d.event;
  if (d.donor !== undefined) document.getElementById("donorInput").value = d.donor;
  if (d.amount !== undefined) document.getElementById("amountInput").value = d.amount;
  if (d.duration !== undefined) document.getElementById("durationInput").value = d.duration;
  if (d.countDuration !== undefined) document.getElementById("countDurationInput").value = d.countDuration;
});

function currentData() {
  return {
    event: document.getElementById("eventInput").value,
    donor: document.getElementById("donorInput").value,
    amount: document.getElementById("amountInput").value,
    duration: Number(document.getElementById("durationInput").value) || 3,
    countDuration: Number(document.getElementById("countDurationInput").value) || 0
  };
}
function saveSettings() {
  DONATION_REF.update(currentData()).then(() => {
    statusEl.textContent = "저장 완료 · 모든 화면에 실시간 반영됨";
  }).catch(err => {
    statusEl.textContent = "저장 오류: " + err.message;
  });
}
function sendTrigger(trigger) {
  DONATION_REF.update({...currentData(), trigger, triggerAt: Date.now()})
    .then(() => {
      statusEl.textContent = trigger === "hide" ? "HIDE 전송 완료" : "알림 전송 완료 · DISPLAY에 실시간 반영";
    }).catch(err => {
      statusEl.textContent = "전송 오류: " + err.message;
    });
}
</script>

</body>
</html>
