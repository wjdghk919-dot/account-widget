<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>고정 계좌 안내</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    background: transparent;

    font-family: Arial, sans-serif;

}

.account-widget {

    position: absolute;

    left: 30px;
    top: 30px;

    width: 360px;

    padding: 12px 16px 13px;

    box-sizing: border-box;

    color: #fff;

    background:
        linear-gradient(
            180deg,
            #24262b 0%,
            #0f1013 100%
        );

    border: 2px solid #d9b33f;

    border-radius: 12px;

    box-shadow:
        0 10px 22px rgba(0,0,0,0.35);

}


.account-top {

    display: flex;

    align-items: center;

    height: 34px;

    border-bottom:
        1px solid #444;

}


.bank-area {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 16px;

    font-weight: 700;

}


.bank-icon {

    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #d9b33f;

    color: #111;

    font-size: 12px;

    font-weight: 900;

}


.initial {

    margin-left: 2px;

    color: #ffffff;

}


.account-guide {

    margin-left: auto;

    padding: 5px 8px;

    border-radius: 4px;

    background: #34373d;

    color: #ffffff;

    font-size: 11px;

    font-weight: 700;

}


.account-number {

    margin-top: 10px;

    color: #fff6c9;

    font-size: 30px;

    line-height: 1.15;

    font-weight: 900;

    letter-spacing: 0.5px;

    white-space: nowrap;

}

</style>

</head>


<body>


<div class="account-widget">


    <div class="account-top">


        <div class="bank-area">


            <div class="bank-icon">

                ₩

            </div>


            <span id="bankText">

                카카오뱅크

            </span>


            <span id="initialText"
                  class="initial">

                JH

            </span>


        </div>


        <div class="account-guide">

            계좌안내

        </div>


    </div>


    <div id="accountText"
         class="account-number">

        3333-04-9692388

    </div>


</div>



<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

    getDatabase,
    ref,
    onValue

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";



const firebaseConfig = {

    apiKey:
        "AIzaSyBDZi7sRmUfh8CwM8kDiUsqU0X5LupK1r8",

    authDomain:
        "broadcast-widgets.firebaseapp.com",

    databaseURL:
        "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "broadcast-widgets",

    storageBucket:
        "broadcast-widgets.firebasestorage.app",

    messagingSenderId:
        "711117372939",

    appId:
        "1:711117372939:web:470a6f5acf88691a12510e",

    measurementId:
        "G-080YENY338"

};



const app =
    initializeApp(firebaseConfig);


const database =
    getDatabase(app);


const accountRef =
    ref(database, "account");



const DEFAULT_DATA = {

    bank: "카카오뱅크",

    initial: "JH",

    account: "3333-04-9692388"

};



function updateDisplay(data) {

    document.getElementById("bankText")
        .textContent =
        data.bank || "";

    document.getElementById("initialText")
        .textContent =
        data.initial || "";

    document.getElementById("accountText")
        .textContent =
        data.account || "";

}



onValue(

    accountRef,

    (snapshot) => {

        const data =
            snapshot.val();

        updateDisplay(
            data || DEFAULT_DATA
        );

    },

    (error) => {

        console.error(
            "Firebase connection error:",
            error
        );

        updateDisplay(
            DEFAULT_DATA
        );

    }

);


</script>


</body>

</html>
