<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방송 알림판 DISPLAY</title>
<style>
html,body{
    margin:0;
    padding:0;
    background:transparent;
    font-family:Arial,sans-serif;
}

.notice-widget{
    position:absolute;
    left:30px;
    top:30px;

    width:520px;
    min-height:170px;
    padding:16px 20px 18px;

    box-sizing:border-box;

    color:#fff;

    background:
        linear-gradient(
            180deg,
            #24262b 0%,
            #0f1013 100%
        );

    border:2px solid #d8b84c;
    border-radius:12px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.14);
}

.header{
    display:flex;
    align-items:center;
    min-height:38px;
}

.title{
    display:flex;
    align-items:center;
    gap:9px;
    color:#fff;
    font-size:28px;
    line-height:1;
    font-weight:900;
    letter-spacing:-.8px;
    white-space:nowrap;
}

.title-icon{
    width:26px;
    height:26px;
    flex:0 0 26px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#d8b84c;
    color:#171717;
    font-size:14px;
    font-weight:900;
}

.divider{
    height:1px;
    margin:11px 0 13px;
    background:rgba(255,255,255,.18);
}

.body{
    color:#fff6c7;
    font-size:24px;
    line-height:1.42;
    font-weight:800;
    letter-spacing:-.3px;
    white-space:pre-wrap;
    word-break:keep-all;
    text-shadow:0 2px 5px rgba(0,0,0,.45);
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body>
<div class="notice-widget">
    <div class="header">
        <div class="title">
            <div class="title-icon">!</div>
            <div id="titleText">공지사항</div>
        </div>
    </div>

    <div class="divider"></div>

    <div id="bodyText" class="body"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBDZi7sRmUfh8CwM8kDiUsaQn1Kr8",
    authDomain: "broadcast-widgets.firebaseapp.com",
    databaseURL: "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "broadcast-widgets",
    storageBucket: "broadcast-widgets.firebasestorage.app",
    messagingSenderId: "711117372939",
    appId: "1:711117372939:web:470a6f5acf88691a12510e",
    measurementId: "G-080YENY338"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const REF = db.ref("notice_board_01");

REF.on("value", (snapshot) => {
    const data = snapshot.val();
    if(!data) return;

    document.getElementById("titleText").textContent =
        data.title || "공지사항";

    document.getElementById("bodyText").textContent =
        data.body || "";

    let size = Number(data.fontSize) || 24;
    size = Math.max(12, Math.min(80, size));

    document.getElementById("bodyText").style.fontSize = size + "px";
});
</script>
</body>
</html>
