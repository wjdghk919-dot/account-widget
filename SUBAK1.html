<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고정 계좌 안내 DISPLAY</title>
<style>
html,body{
    margin:0;
    padding:0;
    background:transparent;
    font-family:Arial,sans-serif;
}

.account-widget{
    position:absolute;
    left:30px;
    top:30px;

    width:360px;
    height:auto;
    padding:12px 16px 13px;

    box-sizing:border-box;

    color:#fff;

    background:
        linear-gradient(
            180deg,
            #24262b 0%,
            #0f1013 100%
        );

    border:2px solid #d8b84c;
    border-radius:12px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.14);
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    min-height:40px;
    gap:10px;
}

.bank-area{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}

.bank-icon{
    width:28px;
    height:28px;

    flex:0 0 28px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#d8b84c;
    color:#171717;

    font-size:14px;
    font-weight:900;
}

.bank-name{
    font-size:30px;
    font-weight:900;
    line-height:1;
    letter-spacing:-1px;
    white-space:nowrap;
}

.initial{
    margin-left:2px;
    color:#f0f0f0;
    font-size:27px;
    line-height:1;
    font-weight:900;
    letter-spacing:0;
    white-space:nowrap;
}

.badge{
    padding:5px 7px;
    border-radius:5px;
    background:rgba(255,255,255,.08);
    color:#ddd;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
}

.divider{
    height:1px;
    margin:9px 0 10px;
    background:rgba(255,255,255,.15);
}

.account-number{
    color:#fff6c7;
    font-size:30px;
    line-height:1.15;
    font-weight:900;
    letter-spacing:.5px;
    white-space:nowrap;
    text-shadow:0 2px 5px rgba(0,0,0,.45);
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>

<body>
<div class="account-widget">
    <div class="header">
        <div class="bank-area">
            <div class="bank-icon">₩</div>
            <div id="bankText" class="bank-name">카카오뱅크</div>
            <div id="initialText" class="initial">JH</div>
        </div>

        <div class="badge">계좌안내</div>
    </div>

    <div class="divider"></div>

    <div id="accountText" class="account-number">
        3333-04-9692388
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBDZi7sRmUfh8CwM8kDiUsaQn1Kr8",
    authDomain: "broadcast-widgets.firebaseapp.com",
    databaseURL: "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "broadcast-widgets",
    storageBucket: "broadcast-widgets.firebasestorage.app",
    messagingSenderId: "711117372939",
    appId: "1:711117372939:web:470a6f5acf88691a12510e",
    measurementId: "G-080YENY338"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const REF = db.ref("fixed_account_guide");

REF.on("value", (snapshot) => {
    const data = snapshot.val();
    if(!data) return;

    document.getElementById("bankText").textContent = data.bank || "카카오뱅크";
    document.getElementById("initialText").textContent = data.initial || "JH";
    document.getElementById("accountText").textContent = data.account || "3333-04-9692388";
});
</script>
</body>
</html>
