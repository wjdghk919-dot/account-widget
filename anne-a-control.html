<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ANNE A - HUD CONTROL</title>
<style>
/* =========================================================
   CONTROL — CYBER THEME
========================================================= */

.control-toggle{
    position:absolute;
    left:720px;
    top:35px;

    height:30px;
    padding:0 12px;

    border:1px solid rgba(77,228,255,.65);
    border-radius:5px;

    background:#111a24;
    color:#62ecff;

    font-size:12px;
    font-weight:900;

    cursor:pointer;
    z-index:30;

    box-shadow:0 0 10px rgba(66,232,255,.10);
}

.control{
    position:absolute;
    left:720px;
    top:80px;

    width:960px;
    padding:16px;

    box-sizing:border-box;

    color:#fff;

    background:
        linear-gradient(180deg, #0d131c, #10141b);

    border:1px solid rgba(82,220,255,.34);
    border-radius:8px;

    box-shadow:
        0 12px 28px rgba(0,0,0,.42),
        0 0 0 1px rgba(255,58,214,.08);
}

.control.hidden{
    display:none;
}

.control h2{
    margin:0 0 13px;
    font-size:20px;
    color:#eaffff;
    text-shadow:0 0 7px rgba(67,229,255,.18);
}

.control-layout{
    display:grid;
    grid-template-columns:1.15fr 1fr;
    gap:18px;
    align-items:start;
}

.control-column{
    min-width:0;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.field{
    margin-bottom:9px;
}

.field label{
    display:block;
    margin-bottom:4px;
    color:#7ca2b0;
    font-size:11px;
}

.field input{
    width:100%;
    height:31px;
    box-sizing:border-box;
    padding:0 8px;

    border:1px solid #354f5d;
    border-radius:4px;

    background:#0b1118;
    color:#eafcff;

    font-size:13px;
    outline:none;
}

.field input:focus{
    border-color:#51e8ff;
    box-shadow:0 0 0 1px rgba(81,232,255,.20);
}

.section-label{
    margin:10px 0 5px;

    color:#70eaff;

    font-size:12px;
    font-weight:900;
}

.donation-editor{
    max-height:330px;
    overflow-y:auto;
    padding-right:3px;
}

.donation-row{
    display:grid;
    grid-template-columns:24px 1fr 105px 30px;
    gap:5px;

    margin-bottom:5px;
}

.donation-row input{
    width:100%;
    height:29px;
    box-sizing:border-box;

    padding:0 7px;

    border:1px solid #354f5d;
    border-radius:4px;

    background:#0b1118;
    color:#eafcff;

    font-size:12px;
}

.row-number{
    display:flex;
    align-items:center;
    justify-content:center;

    color:#536872;
    font-size:10px;
}

.delete-button{
    height:29px;

    border:1px solid #475965;
    border-radius:4px;

    background:#202b34;
    color:#ff8ce8;

    cursor:pointer;
    font-weight:900;
}

.notice-row{
    display:grid;
    grid-template-columns:1fr 30px;
    gap:5px;

    margin-bottom:5px;
}

.notice-row input{
    width:100%;
    height:29px;
    box-sizing:border-box;

    border:1px solid #354f5d;
    border-radius:4px;

    background:#0b1118;
    color:#eafcff;

    font-size:12px;
    padding:0 7px;
}

.notice-row button{
    height:29px;

    border:1px solid #475965;
    border-radius:4px;

    background:#202b34;
    color:#ff8ce8;

    cursor:pointer;
}

.rank-section-label{
    margin-top:16px;
}

.rank-row-editor{
    display:grid;
    grid-template-columns:1fr 90px 30px;
    gap:5px;

    margin-bottom:5px;
}

.rank-row-editor input{
    width:100%;
    height:29px;
    box-sizing:border-box;

    border:1px solid #354f5d;
    border-radius:4px;

    background:#0b1118;
    color:#eafcff;

    font-size:12px;
    padding:0 7px;
}

.rank-row-editor button{
    height:29px;

    border:1px solid #475965;
    border-radius:4px;

    background:#202b34;
    color:#ff8ce8;

    cursor:pointer;
}

.buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;

    margin-top:12px;
}

.buttons button{
    height:34px;
    padding:0 13px;

    border:1px solid #3a5764;
    border-radius:5px;

    font-size:12px;
    font-weight:900;

    cursor:pointer;
}

.apply{
    background:#113844;
    border-color:#4feaff !important;
    color:#65edff;
}

.reset{
    background:#252e36;
    color:#dbe8ed;
}

.add{
    background:#eafcff;
    color:#091015;
}

.speed-field{
    margin-top:14px;
}

.note{
    margin-top:9px;
    color:#627984;

    font-size:10px;
    line-height:1.35;
}

.info-column{
    max-height:620px;
    overflow-y:auto;
    padding-right:3px;
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBDZi7sRmUfh8CwM8kDiUsaQn1Kr8",
  authDomain: "broadcast-widgets.firebaseapp.com",
  databaseURL: "https://broadcast-widgets-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "broadcast-widgets",
  storageBucket: "broadcast-widgets.firebasestorage.app",
  messagingSenderId: "711117372939",
  appId: "1:711117372939:web:470a6f5acf88691a12510e",
  measurementId: "G-080YENY338"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const HUD_REF = db.ref("hud_mission");
</script></head><body><div id="firebaseStatus" style="
    position:absolute; left:720px; top:10px;
    color:#72f2ff; font:700 12px Arial,sans-serif;
    background:#0b1118; border:1px solid #315564;
    border-radius:4px; padding:5px 8px; z-index:50;">
    Firebase 연결 중...
</div>

<div id="controlPanel" class="control">

    <h2>방송 HUD CONTROL</h2>

    <div class="control-layout">

        <!-- LEFT: DONATION -->
        <section class="control-column donation-column">

            <div class="row">

                <div class="field">
                    <label>상단 좌측</label>
                    <input
                        id="accountInput"
                        type="text"
                        value="계좌"
                    >
                </div>

                <div class="field">
                    <label>롤링 표시 제목</label>
                    <input
                        id="titleInput"
                        type="text"
                        value="계좌후원"
                    >
                </div>

            </div>

            <div class="section-label">
                계좌후원 목록
            </div>

            <div
                id="donationEditor"
                class="donation-editor"
            ></div>

            <div class="buttons">
                <button
                    class="add"
                    onclick="addDonation()"
                >
                    + 후원내역 추가
                </button>
            </div>

            <div class="field speed-field">
                <label>롤링 간격 (초)</label>
                <input
                    id="speedInput"
                    type="number"
                    min="1"
                    max="30"
                    value="3"
                >
            </div>

        </section>


        <!-- RIGHT: NOTICE + RANK -->
        <section class="control-column info-column">

            <div class="section-label">
                공지 / 현재 미션
            </div>

            <div class="field">
                <input
                    id="noticeTitleInput"
                    type="text"
                    value="현재미션"
                >
            </div>

            <div id="noticeEditor"></div>

            <div class="section-label rank-section-label">
                참가자 / 점수
            </div>

            <div class="field">
                <input
                    id="rankTitleInput"
                    type="text"
                    value="참가자"
                    placeholder="참가자 제목"
                >
            </div>

            <div id="rankEditor"></div>

            <div class="buttons">
                <button
                    class="apply"
                    onclick="applyHUD()"
                >
                    APPLY
                </button>

                <button
                    class="reset"
                    onclick="resetHUD()"
                >
                    RESET
                </button>

                <button
                    class="reset"
                    onclick="resetDonations()"
                >
                    후원목록 초기화
                </button>
            </div>

            <div class="note">
                계좌후원 목록은 이 창에서 직접 입력합니다.
                빈 줄은 자동으로 제외되며 순서대로 계속 반복됩니다.
            </div>

        </section>

    </div>

<script>
const NOTICE_COUNT = 3;
const RANK_COUNT = 6;
let donations = [{name:"죽밥", amount:"100000"}];
let noticeData = ["9회 댄스 미션","9회 노래 미션","클리어하면 보너스"];
let rankTitleData = "참가자";
let rankData = [
  {name:"병태기", value:"114"},{name:"도땡", value:"76"},{name:"국군", value:"13"},
  {name:"", value:""},{name:"", value:""},{name:"", value:""}
];

function escapeHTML(value){
  return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
}
function escapeAttr(value){ return escapeHTML(value); }

function createDonationEditor(){
  const editor=document.getElementById("donationEditor"); editor.innerHTML="";
  donations.forEach((item,index)=>{
    editor.innerHTML += `<div class="donation-row">
      <div class="row-number">${index+1}</div>
      <input id="donorInput${index}" type="text" value="${escapeAttr(item.name)}" placeholder="후원자">
      <input id="amountInput${index}" type="text" value="${escapeAttr(item.amount)}" placeholder="금액">
      <button class="delete-button" onclick="deleteDonation(${index})">X</button>
    </div>`;
  });
}
function createNoticeEditor(){
  const editor=document.getElementById("noticeEditor"); editor.innerHTML="";
  for(let i=0;i<NOTICE_COUNT;i++){
    editor.innerHTML += `<div class="notice-row">
      <input id="noticeInput${i}" type="text" value="${escapeAttr(noticeData[i]||"")}" placeholder="공지 / 미션">
      <button onclick="clearNotice(${i})">X</button>
    </div>`;
  }
}
function createRankEditor(){
  const editor=document.getElementById("rankEditor"); editor.innerHTML="";
  for(let i=0;i<RANK_COUNT;i++){
    const item=rankData[i]||{name:"",value:""};
    editor.innerHTML += `<div class="rank-row-editor">
      <input id="rankNameInput${i}" type="text" value="${escapeAttr(item.name)}" placeholder="이름">
      <input id="rankValueInput${i}" type="text" value="${escapeAttr(item.value)}" placeholder="점수">
      <button onclick="clearRank(${i})">X</button>
    </div>`;
  }
}
function addDonation(){ donations.push({name:"",amount:""}); createDonationEditor(); }
function deleteDonation(index){
  if(donations.length<=1) donations[0]={name:"",amount:""}; else donations.splice(index,1);
  createDonationEditor();
}
function resetDonations(){ donations=[]; createDonationEditor(); }
function clearNotice(index){ document.getElementById("noticeInput"+index).value=""; }
function clearRank(index){ document.getElementById("rankNameInput"+index).value=""; document.getElementById("rankValueInput"+index).value=""; }

function collectPayload(){
  const d=[];
  for(let i=0;i<donations.length;i++) d.push({
    name:(document.getElementById("donorInput"+i)?.value||"").trim(),
    amount:(document.getElementById("amountInput"+i)?.value||"").trim()
  });
  const notices=[];
  for(let i=0;i<NOTICE_COUNT;i++) notices.push((document.getElementById("noticeInput"+i)?.value||"").trim());
  const ranks=[];
  for(let i=0;i<RANK_COUNT;i++) ranks.push({
    name:(document.getElementById("rankNameInput"+i)?.value||"").trim(),
    value:(document.getElementById("rankValueInput"+i)?.value||"").trim()
  });
  return {
    accountLabel:document.getElementById("accountInput").value.trim(),
    rollingTitle:document.getElementById("titleInput").value.trim(),
    donations:d,
    rollingSeconds:Number(document.getElementById("speedInput").value)||3,
    noticeTitle:document.getElementById("noticeTitleInput").value.trim(),
    notices,
    rankTitle:(document.getElementById("rankTitleInput").value.trim()||"참가자"),
    ranks
  };
}
function setFirebaseStatus(message,ok){
  const el=document.getElementById("firebaseStatus"); if(!el)return;
  el.textContent=message; el.style.color=ok?"#72f2ff":"#ff8ca8";
}
function applyHUD(){
  const payload=collectPayload();
  HUD_REF.set(payload).then(()=>setFirebaseStatus("저장 완료 · 모든 화면에 실시간 반영됨",true))
    .catch(error=>{console.error(error);setFirebaseStatus("Firebase 저장 실패",false);});
}
function resetHUD(){
  document.getElementById("accountInput").value="계좌";
  document.getElementById("titleInput").value="계좌후원";
  document.getElementById("noticeTitleInput").value="현재미션";
  document.getElementById("rankTitleInput").value="참가자";
  document.getElementById("speedInput").value=3;
  donations=[{name:"죽밥",amount:"100000"}];
  noticeData=["9회 댄스 미션","9회 노래 미션","클리어하면 보너스"];
  rankData=[{name:"병태기",value:"114"},{name:"도땡",value:"76"},{name:"국군",value:"13"},{name:"",value:""},{name:"",value:""},{name:"",value:""}];
  createDonationEditor();createNoticeEditor();createRankEditor();
}
function loadExisting(data){
  if(!data)return;
  document.getElementById("accountInput").value=data.accountLabel??"계좌";
  document.getElementById("titleInput").value=data.rollingTitle??"계좌후원";
  document.getElementById("speedInput").value=data.rollingSeconds??3;
  document.getElementById("noticeTitleInput").value=data.noticeTitle??"현재미션";
  document.getElementById("rankTitleInput").value=data.rankTitle??"참가자";
  donations=Array.isArray(data.donations)?data.donations.map(x=>({name:x?.name||"",amount:x?.amount||""})):[];
  noticeData=Array.isArray(data.notices)?data.notices.slice(0,NOTICE_COUNT):["","",""];
  while(noticeData.length<NOTICE_COUNT)noticeData.push("");
  rankData=Array.isArray(data.ranks)?data.ranks.slice(0,RANK_COUNT).map(x=>({name:x?.name||"",value:x?.value||""})):[];
  while(rankData.length<RANK_COUNT)rankData.push({name:"",value:""});
  createDonationEditor();createNoticeEditor();createRankEditor();
}

createDonationEditor();createNoticeEditor();createRankEditor();
setFirebaseStatus("Firebase 연결 중...",true);
HUD_REF.on("value",snap=>{
  if(snap.exists()){loadExisting(snap.val());setFirebaseStatus("Firebase 연결됨 · 실시간 동기화 중",true);}
  else setFirebaseStatus("Firebase 연결됨 · 아직 저장된 데이터 없음",true);
},error=>{console.error(error);setFirebaseStatus("Firebase 연결 오류",false);});
</script></body></html>
